<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <title>Task 5</title>
        <script src="https://code.jquery.com/jquery-3.6.4.slim.min.js"></script>
        <style>
            .delete-cell {
                background-color: orange;
                cursor: pointer;
                text-align: center;
            }
            table {
                border-collapse: collapse;
            }
            th {
                background-color: #f2f2f2;
            }
        </style>
    </head>
    <body>
        <script type="application/javascript">
            function createFamilyTree() {
                $('body').append(
                    $('<table>').append(
                        $('<thead>').append(
                            $('<tr>').append(
                                $('<th>').text('Firstname'),
                                $('<th>').text('Lastname'),
                                $('<th>').text('Action')
                            )
                        ),
                        $('<tbody>')
                    )
                );
            }
            // addNewMember section //
            function addNewMember(firstName, lastName) {
                $('tbody').append(
                    $('<tr>').append(
                        $('<td>').text(firstName),
                        $('<td>').text(lastName),
                        $('<td>').text('(x)')
                            .addClass('delete-cell')
                            //.css for the black x //
                            .css('color', 'black', 'text-align', 'center')
                            .click(function() {
                                $(this).parent().remove();
                            })
                    )
                );
            }
            // createFamilyTree section //
            $(function() {
                createFamilyTree();
                addNewMember('Guillaume', 'Salva');
                addNewMember('Arielle', 'Snizt');
                addNewMember('Fanette', 'Snizt');
                addNewMember('Gerard', 'Snizt');
                addNewMember('Victor', 'Salva');
            });
        </script>
    </body>
</html>
