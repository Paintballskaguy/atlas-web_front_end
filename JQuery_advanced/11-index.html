<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <title>JSON Server Posts</title>
        <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                padding: 20px;
            }
            form {
                margin-bottom: 20px;
                padding: 15px;
                border: 1px solid #ddd;
                border-radius: 5px;
                max-width: 500px;
            }
            div {
                margin-bottom: 10px;
            }
            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
            }
            input[type="text"], textarea {
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
                border: 1px solid #ddd;
                border-radius: 4px;
            }
            textarea {
                height: 100px;
                resize: vertical;
            }
            input[type="submit"] {
                background-color: #4CAF50;
                color: white;
                padding: 10px 15px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            input[type="submit"]:hover {
                background-color: #45a049;
            }
            p {
                margin: 10px 0;
                padding: 8px;
                background: #f5f5f5;
                border-radius: 4px;
            }
            .status {
                color: #666;
                font-style: italic;
                margin: 10px 0;
            }
        </style>
    </head>
    <body>
        <script type="application/javascript">
            function addPostRow(data) {
                $('body').append(
                    $('<p>').text(
                        `Post created with id ${data.id}, title: ${data.title}, author: ${data.author}`
                    )
                );
            }

            // list posts from server //
            function listPosts() {
                $.get('http://localhost:3000/posts')
                    .done(function(response) {
                        response.forEach(post => {
                            addPostRow(post);
                        });
                    })
                    .fail(function() {
                        alert('Server Error');
                    });
            }

            // builds the form //
            function buildForm() {
                const form = $('<form>').append(
                    $('<div>').append(
                        $('<label>').attr('for', 'author').text('Author'),
                        $('<input>').attr({
                            type: 'text',
                            id: 'author',
                            name: 'author',
                            required: true
                        })
                    ),
                    $('<div>').append(
                        $('<label>').attr('for', 'title').text('Title'),
                        $('<textarea>').attr({
                            id: 'title',
                            name: 'title',
                            required: true
                        })
                    ),
                    $('<input>').attr({
                        type: 'submit',
                        value: 'Submit Post'
                    })
                );

                // handles form submission //
                form.on('submit', function(e) {
                    e.preventDefault();
                    sendForm();
                });

                $('body').on('click', 'label', function() {
                    $('#' + $(this).attr('for')).focus();
                });

                $('body').append(form);
            }

            // sends form data //
            function sendForm() {
                $('form').after($('<div class="status">').text('About to send the query to the API'));

                const postData = {
                    title: $('#title').val(),
                    author: $('#author').val()
                };

                $.ajax({
                    url: 'http://localhost:3000/posts',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(postData),
                    success: function(response) {
                        addPostRow(response);
                        $('.status').remove();
                        $('form')[0].reset();
                    },
                    error: function() {
                        alert('Error sending the POST query');
                        $('.status').remove();
                    }
                });
            }

            $(function() {
                listPosts();
                buildForm();
            });
        </script>
    </body>
</html>
