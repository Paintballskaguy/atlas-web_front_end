<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cookie Management</title>
</head>
<body>
  <h2>Login to the website</h2>
  
  <div>
    <label for="firstname">First Name:</label>
    <input type="text" id="firstname" placeholder="Enter your first name">
  </div>
  
  <div>
    <label for="email">Email:</label>
    <input type="text" id="email" placeholder="Enter your email">
  </div>
  
  <button onclick="setCookies()">Log me in</button>
  
  <h3>Cookies</h3>
  <button onclick="showCookies()">Show the cookies</button>
  
  <div id="cookieDisplay"></div>

  <script>
    function setCookies() {
      const firstname = document.getElementById('firstname').value;
      const email = document.getElementById('email').value;
      
      // expiration set to 10 days //
      const expirationDate = new Date();
      expirationDate.setDate(expirationDate.getDate() + 10);
      
      document.cookie = `firstname=${firstname}; expires=${expirationDate.toUTCString()}; path=/`;
      document.cookie = `email=${email}; expires=${expirationDate.toUTCString()}; path=/`;
      
      const display = document.getElementById('cookieDisplay');
      display.innerHTML = 'Cookies set successfully!';
    }
    // getCookie function //
    function getCookie(name) {
        const cookies = document.cookie.split('; ');
        for (const cookie of cookies) {
          const [cookieName, cookieValue] = cookie.split('=');
          if (cookieName === name) {
            return cookieValue;
          }
        }
        return '';
      }
      function showCookies() {
        const display = document.getElementById('cookieDisplay');
        const email = getCookie('email');
        const firstname = getCookie('firstname');
        
        if (email || firstname) {
          display.innerHTML = `<br>Email: ${email || 'Not set'} Firstname: ${firstname || 'Not set'}`;
        } else {
          display.innerHTML = 'No login cookies found (firstname/email)';
        }
      }
    </script>
</body>
</html>
