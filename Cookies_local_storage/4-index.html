<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enhanced Cookie Management with js-cookie</title>
  <!-- Add js-cookie from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
  <style>
    #loginForm {
      margin: 20px 0;
    }
    #loginForm div {
      margin-bottom: 10px;
    }
    .logout-link {
      font-weight: normal;
      font-style: italic;
      margin-left: 10px;
      color: #0066cc;
      text-decoration: none;
    }
    .logout-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="loginForm">
    <h2>Login to the website</h2>
    
    <div>
      <label for="firstname">First Name:</label>
      <input type="text" id="firstname" placeholder="Enter your first name">
    </div>
    
    <div>
      <label for="email">Email:</label>
      <input type="text" id="email" placeholder="Enter your email">
    </div>
    
    <button onclick="setCookiesAndShowWelcomeMessage()">Log me in</button>
  </div>

  <script>
    function showForm() {
      const welcomeMessage = document.getElementById('welcomeMessage');
      if (welcomeMessage) {
        document.body.removeChild(welcomeMessage);
      }
      document.getElementById('loginForm').style.display = 'block';
    }

    function hideForm() {
      document.getElementById('loginForm').style.display = 'none';
    }

    function deleteCookiesAndShowForm() {
      Cookies.remove('firstname');
      Cookies.remove('email');
      showForm();
    }

    // Welcome message functions //
    function createWelcomeMessage(firstname) {
      const welcomeDiv = document.createElement('div');
      welcomeDiv.id = 'welcomeMessage';
      
      const welcomeHeading = document.createElement('h1');
      welcomeHeading.textContent = `Welcome ${firstname} `;
      
      const logoutLink = document.createElement('a');
      logoutLink.href = '#';
      logoutLink.className = 'logout-link';
      logoutLink.textContent = '(logout)';
      logoutLink.onclick = function(e) {
        e.preventDefault();
        deleteCookiesAndShowForm();
      };
      
      welcomeHeading.appendChild(logoutLink);
      welcomeDiv.appendChild(welcomeHeading);
      
      return welcomeDiv;
    }

    function setCookiesAndShowWelcomeMessage() {
      const firstname = document.getElementById('firstname').value;
      const email = document.getElementById('email').value;
      
      Cookies.set('firstname', firstname, { expires: 10 });
      Cookies.set('email', email, { expires: 10 });
      
      showWelcomeMessageOrForm();
    }

    function showWelcomeMessageOrForm() {
      const firstname = Cookies.get('firstname');
      
      if (firstname) {
        hideForm();
        const welcomeMessage = createWelcomeMessage(firstname);
        document.body.insertBefore(welcomeMessage, document.body.firstChild);
      } else {
        showForm();
      }
    }

    showWelcomeMessageOrForm();
  </script>
</body>
</html>
