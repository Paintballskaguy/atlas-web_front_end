<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
</head>
<body>
  <div id="app"></div>

  <script>
    // Available items array //
    const availableItems = ['Shampoo', 'Soap', 'Sponge', 'Water'];

    if (typeof(Storage) === 'undefined') {
      alert('Sorry, your browser does not support Web storage. Try again with a better one');
    } else {
      createStore();
      displayCart();
    }

    // Add item to cart function //
    function addItemToCart(item) {
      localStorage.setItem(item, 'true');
      displayCart();
    }

    // Create store function //
    function createStore() {
      const appDiv = document.getElementById('app');
      
      // Create heading //
      const heading = document.createElement('h1');
      heading.textContent = 'Available Products';
      appDiv.appendChild(heading);
      
      // Create product list //
      const ul = document.createElement('ul');
      ul.style.listStyleType = 'none';
      ul.style.padding = '0';
      
      // Add each item to the list //
      availableItems.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        li.style.padding = '10px';
        li.style.margin = '5px 0';
        li.style.backgroundColor = '#f0f0f0';
        li.style.cursor = 'pointer';
        li.style.borderRadius = '5px';
        
        li.addEventListener('click', () => {
          addItemToCart(item);
          li.style.backgroundColor = '#d0f0d0';
          setTimeout(() => {
            li.style.backgroundColor = '#f0f0f0';
          }, 300);
        });
        
        ul.appendChild(li);
      });
      
      appDiv.appendChild(ul);
    }

    // Display cart function //
    function displayCart() {
      // Remove previous cart message if it exists //
      const prevMessage = document.getElementById('cart-message');
      if (prevMessage) {
        prevMessage.remove();
      }
      
      // Count items in cart //
      const cartItems = Object.keys(localStorage).filter(key => 
        availableItems.includes(key)
      );
      
      if (cartItems.length > 0) {
        const appDiv = document.getElementById('app');
        const message = document.createElement('p');
        message.id = 'cart-message';
        message.textContent = `You previously had ${cartItems.length} items in your cart`;
        message.style.marginTop = '20px';
        message.style.padding = '10px';
        message.style.backgroundColor = '#e0e0ff';
        message.style.borderRadius = '5px';
        
        const heading = document.querySelector('h1');
        heading.insertAdjacentElement('afterend', message);
      }
    }
  </script>
</body>
</html>
